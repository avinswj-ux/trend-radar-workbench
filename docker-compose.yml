name: trend-radar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trend_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
volumes:
  postgres_data:
